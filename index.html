<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokladnička Sovička</title>
    
    <!-- PWA / Mobile web app podpora -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sovička">

    <style>
        :root {
            --bg-color: #f4f6f8;
            --surface-color: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-gold: #fbbf24;
            --accent-gold-dark: #d97706;
            
            --completed-green: #48bb78;
            --completed-bg: #f0fff4;
            --urgent-orange: #ed8936;
            --urgent-bg: #fffaf0;

            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Pokladnička */
        .treasury {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .treasury h1 {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .coin-counter {
            font-size: 3.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--accent-gold-dark);
            transition: transform 0.1s ease;
        }
        
        .coin-counter.pulse {
            transform: scale(1.1);
        }

        .main-coin {
            width: 70px;
            height: 70px;
        }

        /* Grid kategorií */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .category-column {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .category-column:nth-child(1) { border-top: 5px solid #38b2ac; }
        .category-column:nth-child(2) { border-top: 5px solid #fc8181; }
        .category-column:nth-child(3) { border-top: 5px solid #63b3ed; }

        .category-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Design úkolů */
        .task-card {
            background: var(--surface-color);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .task-card:not(.completed):active {
            transform: scale(0.97);
            background-color: #fafafa;
        }

        .task-card.urgent:not(.completed) {
            border: 2px solid var(--urgent-orange);
            background-color: var(--urgent-bg);
            box-shadow: 0 0 10px rgba(237, 137, 54, 0.3);
        }

        .urgent-badge {
            display: block;
            background: var(--urgent-orange);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 4px;
            width: max-content;
        }

        .task-card.completed {
            border-color: var(--completed-green);
            background-color: var(--completed-bg);
            cursor: default;
        }

        .task-card.completed .task-title {
            color: var(--completed-green);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .task-card.completed .urgent-badge {
            background-color: var(--completed-green);
            opacity: 0.7;
        }

        .task-card.completed .task-reward {
            background-color: #c6f6d5;
            color: var(--completed-green);
            border-color: var(--completed-green);
        }

        .task-info {
            flex-grow: 1;
            padding-right: 10px;
        }

        .task-title {
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .task-reward {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--accent-gold-dark);
            background: #fef3c7;
            border: 1px solid transparent;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .reward-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .custom-task-section {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border-top: 5px solid var(--accent-gold);
        }

        .custom-task-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .custom-task-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .custom-task-input:focus {
            border-color: var(--accent-gold-dark);
        }

        .custom-coin-input {
            width: 100px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        .custom-task-btn {
            background: var(--accent-gold-dark);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .custom-task-btn:hover { opacity: 0.9; }

        .controls-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        button.primary-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            transition: transform 0.1s;
        }

        button.secondary-btn {
            background: #edf2f7;
            color: var(--text-main);
            border: 1px solid #cbd5e0;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            transition: all 0.2s;
        }

        button.secondary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        button.primary-btn:active, button.secondary-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        .log-section {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .log-list {
            font-size: 0.9rem;
            color: var(--text-muted);
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
        }

        .log-item {
            padding: 8px;
            border-bottom: 1px solid #f4f6f8;
            display: flex;
            justify-content: space-between;
        }
        
        .log-item:last-child { border-bottom: none; }
        
        button.text-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
<div id="auth-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: var(--surface-color); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center;">
        <h2 style="margin-bottom: 20px;">Přihlášení</h2>
        <input type="email" id="auth-email" placeholder="E-mail" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; border-radius: 8px;">
        <input type="password" id="auth-pass" placeholder="Heslo" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 8px;">
        
        <button class="primary-btn" onclick="login()" style="margin-bottom: 10px; width: 100%;">Přihlásit se</button>
        <button class="secondary-btn" onclick="register()" style="width: 100%;">Nová registrace</button>
    </div>
</div>

<div class="container">
    <div class="treasury">
        <h1>Moje Pokladnička</h1>
        <div class="coin-counter" id="main-counter">
            <span id="total-coins">0</span>
            <svg class="main-coin" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
                <circle cx="50" cy="50" r="35" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4"/>
                <path d="M 36 62 C 30 40, 70 40, 64 62 C 64 70, 36 70, 36 62 Z 
                         M 38 43 L 37 34 L 45 39 
                         M 62 43 L 63 34 L 55 39" 
                      stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <!-- Sloupce s úkoly -->
    <div class="categories-grid" id="app-content">
        <!-- Generováno přes JS -->
    </div>

    <!-- Volné pole -->
    <div class="custom-task-section">
        <div class="category-header">Volná akce / Výběr zlaťáků</div>
        <div class="custom-task-form">
            <input type="text" id="custom-title" class="custom-task-input" placeholder="Popis akce (např. Výběr na dovolenou)">
            <input type="number" id="custom-reward" class="custom-coin-input" placeholder="🪙 +/-" step="1">
            <button class="custom-task-btn" onclick="executeCustomTask()">Provést transakci</button>
        </div>
    </div>

    <!-- Ovládání -->
    <div class="controls-section">
        <button class="primary-btn" onclick="generateNewDay()">Zahájit nový den</button>
        <button class="secondary-btn" id="reroll-btn" onclick="rerollUrgent()">🎲 Přelosovat urgenci (1 🪙)</button>
        <button class="text-btn" onclick="logout()" style="margin-top: 15px;">Odhlásit se</button>
    </div>

    <!-- Historie -->
    <div class="log-section">
        <div class="log-header">
            <h3>Historie pokladničky (Log)</h3>
        </div>
        <ul class="log-list" id="activity-log"></ul>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ZDE DOPLŇ SVÉ ÚDAJE ZE SUPABASE
    const supabaseUrl = 'https://sntolcwdfwfervcogcyw.supabase.co';
    const supabaseKey = 'sb_publishable_V4dGwYnz22pATdjlnJ2SMQ_KyB-xALF';
    
    // ZMĚNA: Přejmenováno na supabaseClient, aby to nekolidovalo
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let taskPool = []; 

    // AUTENTIZACE
    async function initAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        handleSession(session);

        supabaseClient.auth.onAuthStateChange((event, session) => {
            handleSession(session);
        });
    }

    function handleSession(session) {
        const authScreen = document.getElementById('auth-screen');
        if (session) {
            currentUser = session.user;
            authScreen.style.display = 'none';
            initApp(); 
        } else {
            currentUser = null;
            authScreen.style.display = 'flex';
        }
    }

    async function login() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-pass').value;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert("Chyba přihlášení: " + error.message);
    }

    async function register() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-pass').value;
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
            alert("Chyba registrace: " + error.message);
        } else {
            alert("Registrace úspěšná! Nyní jsi přihlášen.");
        }
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.reload(); 
    }

    // APLIKAČNÍ STAV A FUNKCE
    let state = {
        totalCoins: 0,
        logs: [],
        todayTasks: [],
        rerollUsedToday: false
    };

    const svgCoin1 = `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="40" fill="#fbbf24" stroke="#d97706" stroke-width="4"/><circle cx="50" cy="50" r="28" fill="none" stroke="#d97706" stroke-width="2"/></svg>`;
    const svgCoinStack = `<svg viewBox="0 0 100 100" width="100%" height="100%"><ellipse cx="50" cy="75" rx="35" ry="15" fill="#d97706" /><ellipse cx="50" cy="70" rx="35" ry="15" fill="#fbbf24" /><ellipse cx="50" cy="55" rx="35" ry="15" fill="#d97706" /><ellipse cx="50" cy="50" rx="35" ry="15" fill="#fbbf24" /><ellipse cx="50" cy="35" rx="35" ry="15" fill="#d97706" /><ellipse cx="50" cy="30" rx="35" ry="15" fill="#fbbf24" /></svg>`;
    const svgCoinPile = `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="30" cy="70" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><circle cx="70" cy="65" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><circle cx="50" cy="45" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><circle cx="45" cy="80" r="15" fill="#fbbf24" stroke="#d97706" stroke-width="2"/></svg>`;

    function getCoinIcon(reward) {
        const absReward = Math.abs(reward);
        if (absReward <= 1) return svgCoin1;
        if (absReward >= 2 && absReward <= 4) return svgCoinStack;
        return svgCoinPile;
    }

    async function initApp() {
        try {
            const response = await fetch('tasks.csv');
            if (!response.ok) throw new Error('Nelze načíst CSV soubor');
            const csvText = await response.text();
            parseCSV(csvText);
            await loadState();
        } catch (error) {
            console.error("Chyba při načítání tasks.csv:", error);
            alert("Nepodařilo se načíst úkoly ze souboru tasks.csv.");
        }
    }

    function parseCSV(text) {
        taskPool = [];
        const lines = text.split('\n');
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const parts = line.split(';');
            if (parts.length >= 4) {
                taskPool.push({
                    id: parseInt(parts[0].trim(), 10),
                    cat: parts[1].trim(),
                    title: parts[2].trim(),
                    reward: parseInt(parts[3].trim(), 10)
                });
            }
        }
    }

    async function loadState() {
        if (!currentUser) return;
        try {
            const { data, error } = await supabaseClient
                .from('app_state')
                .select('*')
                .eq('user_id', currentUser.id)
                .single();

            if (error && error.code !== 'PGRST116') throw error;

            if (data) {
                state.totalCoins = data.total_coins;
                state.logs = data.logs || [];
                state.todayTasks = data.today_tasks || [];
                state.rerollUsedToday = data.reroll_used_today;
            } else {
                await supabaseClient.from('app_state').insert({ user_id: currentUser.id });
            }
        } catch (err) {
            console.error("Chyba načítání dat:", err);
        }
        
        if (!state.todayTasks || state.todayTasks.length === 0) {
            generateNewDay(true);
        } else {
            renderApp();
        }
    }

    async function saveState() {
        if (!currentUser) return;
        const { error } = await supabaseClient
            .from('app_state')
            .update({
                total_coins: state.totalCoins,
                logs: state.logs,
                today_tasks: state.todayTasks,
                reroll_used_today: state.rerollUsedToday
            })
            .eq('user_id', currentUser.id);

        if (error) console.error("Chyba při ukládání:", error);
    }

    function playCoinSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1318.51, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } catch (e) {}
    }

    function generateNewDay(isInitial = false) {
        if (!isInitial && state.todayTasks.length > 0) {
            if (!confirm("Opravdu chceš zahájit nový den? Všechny dnešní NESPLNĚNÉ úkoly zmizí a vygenerují se nové.")) {
                return;
            }
        }
        state.todayTasks = [];
        state.rerollUsedToday = false;
        
        const categories = ["Síla a zdraví", "Vztahy", "Moudrost a bohatství"];
        
        categories.forEach(catName => {
            const filtered = taskPool.filter(t => t.cat === catName);
            const shuffled = filtered.sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 5);
            selected.forEach(t => {
                state.todayTasks.push({ id: t.id, completed: false, isUrgent: false });
            });
        });

        if (state.todayTasks.length > 0) {
            const randomIndex = Math.floor(Math.random() * state.todayTasks.length);
            state.todayTasks[randomIndex].isUrgent = true;
        }

        saveState();
        renderApp();
    }

    function rerollUrgent() {
        const uncompletedTasks = state.todayTasks.filter(t => !t.completed);
        if (state.rerollUsedToday) { alert("Reroll už byl dnes použit!"); return; }
        if (state.totalCoins < 1) { alert("Na reroll potřebuješ alespoň 1 zlaťák!"); return; }
        if (uncompletedTasks.length < 2) { alert("Pro reroll potřebuješ alespoň 2 otevřené úkoly."); return; }

        state.totalCoins -= 1;
        state.rerollUsedToday = true;

        const currentUrgent = state.todayTasks.find(t => t.isUrgent && !t.completed);
        if (currentUrgent) currentUrgent.isUrgent = false;

        const eligibleNewTasks = state.todayTasks.filter(t => !t.completed && t !== currentUrgent);
        const randomPick = eligibleNewTasks[Math.floor(Math.random() * eligibleNewTasks.length)];
        randomPick.isUrgent = true;

        state.logs.unshift({ id: Date.now(), timestamp: new Date().toISOString(), catName: "Systém", title: "🎲 Reroll urgence", reward: -1 });
        saveState();
        renderApp();
        pulseCounter();
    }

    function completeTask(taskId) {
        const taskState = state.todayTasks.find(t => t.id === taskId);
        if (!taskState || taskState.completed) return;
        const fullData = taskPool.find(t => t.id === taskId);
        if (!fullData) return;

        const finalReward = taskState.isUrgent ? (fullData.reward * 2) : fullData.reward;
        taskState.completed = true;
        state.totalCoins += finalReward;

        state.logs.unshift({ id: new Date().getTime(), timestamp: new Date().toISOString(), catName: fullData.cat, title: taskState.isUrgent ? `🔥 ${fullData.title}` : fullData.title, reward: finalReward });
        saveState();
        renderApp();
        pulseCounter();
        playCoinSound();
    }

    function executeCustomTask() {
        const titleInput = document.getElementById("custom-title");
        const rewardInput = document.getElementById("custom-reward");
        const title = titleInput.value.trim();
        const reward = parseInt(rewardInput.value, 10);

        if (!title) { alert("Zadej prosím popis akce."); return; }
        if (isNaN(reward) || reward === 0) { alert("Zadej platný počet zlaťáků (např. 10 nebo -50)."); return; }

        state.totalCoins += reward;
        state.logs.unshift({ id: new Date().getTime(), timestamp: new Date().toISOString(), catName: "Volná akce", title: title, reward: reward });
        titleInput.value = "";
        rewardInput.value = "";
        saveState();
        renderApp();
        pulseCounter();
        if (reward > 0) playCoinSound();
    }

    const appContainer = document.getElementById("app-content");
    const counterSpan = document.getElementById("total-coins");
    const logList = document.getElementById("activity-log");
    const rerollBtn = document.getElementById("reroll-btn");

    function renderApp() {
        counterSpan.innerText = state.totalCoins;
        const openTasksCount = state.todayTasks.filter(t => !t.completed).length;
        const canReroll = !state.rerollUsedToday && state.totalCoins >= 1 && openTasksCount >= 2;
        rerollBtn.disabled = !canReroll;
        rerollBtn.innerText = state.rerollUsedToday ? "🎲 Přelosováno (zítra znovu)" : "🎲 Přelosovat urgenci (1 🪙)";

        logList.innerHTML = "";
        state.logs.slice(0, 50).forEach(entry => {
            const date = new Date(entry.timestamp);
            const formattedTime = date.toLocaleDateString('cs-CZ') + ' ' + date.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'});
            const sign = entry.reward >= 0 ? "+" : "";
            const li = document.createElement("li");
            li.className = "log-item";
            li.innerHTML = `<span>${formattedTime} - ${entry.title} (${entry.catName})</span><strong>${sign}${entry.reward} Z</strong>`;
            logList.appendChild(li);
        });

        appContainer.innerHTML = "";
        const categoriesNames = ["Síla a zdraví", "Vztahy", "Moudrost a bohatství"];

        categoriesNames.forEach(catName => {
            const col = document.createElement("div");
            col.className = "category-column";
            const header = document.createElement("div");
            header.className = "category-header";
            header.innerText = catName;
            col.appendChild(header);

            const tasksForTodayInCat = state.todayTasks
                .map(tState => {
                    const fullData = taskPool.find(tData => tData.id === tState.id);
                    if (fullData && fullData.cat === catName) {
                        return { ...fullData, completed: tState.completed, isUrgent: tState.isUrgent };
                    }
                    return null;
                })
                .filter(t => t !== null);
            
            tasksForTodayInCat.forEach(task => {
                const taskDiv = document.createElement("div");
                let classNames = "task-card";
                if (task.completed) classNames += " completed";
                if (task.isUrgent) classNames += " urgent";
                taskDiv.className = classNames;
                if (!task.completed) taskDiv.onclick = () => completeTask(task.id);

                const displayReward = task.isUrgent ? (task.reward * 2) : task.reward;
                const urgentBadgeHTML = task.isUrgent ? `<span class="urgent-badge">🔥 URGENTNÍ (2x)</span>` : '';

                taskDiv.innerHTML = `
                    <div class="task-info">${urgentBadgeHTML}<div class="task-title">${task.title}</div></div>
                    <div class="task-reward"><span>+${displayReward}</span><div class="reward-icon">${getCoinIcon(displayReward)}</div></div>
                `;
                col.appendChild(taskDiv);
            });
            appContainer.appendChild(col);
        });
    }

    function pulseCounter() {
        const cnt = document.getElementById('main-counter');
        cnt.classList.add('pulse');
        setTimeout(() => cnt.classList.remove('pulse'), 150);
    }

    // SPUSŤ PO NAČTENÍ STRÁNKY
    initAuth();
</script>
