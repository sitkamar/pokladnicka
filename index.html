<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokladnička Sovička</title>
    
    <!-- PWA / Mobile web app podpora -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sovička">

    <style>
        :root {
            --bg-color: #f4f6f8;
            --surface-color: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-gold: #fbbf24;
            --accent-gold-dark: #d97706;
            
            --completed-green: #48bb78;
            --completed-bg: #f0fff4;
            --urgent-orange: #ed8936;
            --urgent-bg: #fffaf0;

            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Pokladnička */
        .treasury {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .treasury h1 {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .coin-counter {
            font-size: 3.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--accent-gold-dark);
            transition: transform 0.1s ease;
        }
        
        .coin-counter.pulse {
            transform: scale(1.1);
        }

        .main-coin {
            width: 70px;
            height: 70px;
        }

        /* Grid kategorií */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .category-column {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .category-column:nth-child(1) { border-top: 5px solid #38b2ac; }
        .category-column:nth-child(2) { border-top: 5px solid #fc8181; }
        .category-column:nth-child(3) { border-top: 5px solid #63b3ed; }

        .category-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Design úkolů */
        .task-card {
            background: var(--surface-color);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .task-card:not(.completed):active {
            transform: scale(0.97);
            background-color: #fafafa;
        }

        /* Stav Urgentního úkolu */
        .task-card.urgent:not(.completed) {
            border: 2px solid var(--urgent-orange);
            background-color: var(--urgent-bg);
            box-shadow: 0 0 10px rgba(237, 137, 54, 0.3);
        }

        .urgent-badge {
            display: block;
            background: var(--urgent-orange);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 4px;
            width: max-content;
        }

        /* Stav splněného úkolu */
        .task-card.completed {
            border-color: var(--completed-green);
            background-color: var(--completed-bg);
            cursor: default;
        }

        .task-card.completed .task-title {
            color: var(--completed-green);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .task-card.completed .urgent-badge {
            background-color: var(--completed-green);
            opacity: 0.7;
        }

        .task-card.completed .task-reward {
            background-color: #c6f6d5;
            color: var(--completed-green);
            border-color: var(--completed-green);
        }

        .task-info {
            flex-grow: 1;
            padding-right: 10px;
        }

        .task-title {
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .task-reward {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--accent-gold-dark);
            background: #fef3c7;
            border: 1px solid transparent;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .reward-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* FÁZE 6: Volné pole / Vlastní transakce */
        .custom-task-section {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border-top: 5px solid var(--accent-gold);
        }

        .custom-task-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .custom-task-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .custom-task-input:focus {
            border-color: var(--accent-gold-dark);
        }

        .custom-coin-input {
            width: 100px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        .custom-task-btn {
            background: var(--accent-gold-dark);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .custom-task-btn:hover { opacity: 0.9; }

        /* Controls (Generování & Reroll) */
        .controls-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        button.primary-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            transition: transform 0.1s;
        }

        button.secondary-btn {
            background: #edf2f7;
            color: var(--text-main);
            border: 1px solid #cbd5e0;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            transition: all 0.2s;
        }

        button.secondary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        button.primary-btn:active, button.secondary-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        /* Sekce Logování (Historie) */
        .log-section {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .log-list {
            font-size: 0.9rem;
            color: var(--text-muted);
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
        }

        .log-item {
            padding: 8px;
            border-bottom: 1px solid #f4f6f8;
            display: flex;
            justify-content: space-between;
        }
        
        .log-item:last-child { border-bottom: none; }
        
        button.text-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="treasury">
        <h1>Moje Pokladnička</h1>
        <div class="coin-counter" id="main-counter">
            <span id="total-coins">0</span>
            <!-- ZLAŤÁK S JEDNODUCHOU SOVIČKOU (JEDNA LINKA) -->
            <svg class="main-coin" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
                <circle cx="50" cy="50" r="35" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4"/>
                
                <!-- Čistý obrys malé sovy bez rušivých detailů -->
                <path d="M 36 62 C 30 40, 70 40, 64 62 C 64 70, 36 70, 36 62 Z 
                         M 38 43 L 37 34 L 45 39 
                         M 62 43 L 63 34 L 55 39" 
                      stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <!-- Sloupce s úkoly -->
    <div class="categories-grid" id="app-content">
        <!-- Generováno přes JS -->
    </div>

    <!-- FÁZE 6: Volné pole / Mimořádná transakce -->
    <div class="custom-task-section">
        <div class="category-header">Volná akce / Výběr zlaťáků</div>
        <div class="custom-task-form">
            <input type="text" id="custom-title" class="custom-task-input" placeholder="Popis akce (např. Výběr na dovolenou)">
            <input type="number" id="custom-reward" class="custom-coin-input" placeholder="🪙 +/-" step="1">
            <button class="custom-task-btn" onclick="executeCustomTask()">Provést transakci</button>
        </div>
    </div>

    <!-- Ovládání (Nový den & FÁZE 4: Reroll) -->
    <div class="controls-section">
        <button class="primary-btn" onclick="generateNewDay()">Zahájit nový den</button>
        <button class="secondary-btn" id="reroll-btn" onclick="rerollUrgent()">🎲 Přelosovat urgenci (1 🪙)</button>
    </div>

    <!-- Historie -->
    <div class="log-section">
        <div class="log-header">
            <h3>Historie pokladničky (Log)</h3>
            <button class="text-btn" onclick="clearData()">[Smazat data]</button>
        </div>
        <ul class="log-list" id="activity-log"></ul>
    </div>

</div>

<script>
    const taskPool = [
        { id: 101, cat: "Síla a zdraví", title: "Vypít sklenici vody", reward: 1 },
        { id: 102, cat: "Síla a zdraví", title: "Ujít 1 000 kroků", reward: 1 },
        { id: 103, cat: "Síla a zdraví", title: "Udělat 10 dřepů", reward: 1 },
        { id: 104, cat: "Síla a zdraví", title: "Udělat 5 kliků", reward: 1 },
        { id: 105, cat: "Síla a zdraví", title: "1 minuta planku", reward: 1 },
        { id: 106, cat: "Síla a zdraví", title: "Zdravější varianta jídla", reward: 1 },
        { id: 107, cat: "Síla a zdraví", title: "Vynechat sladkost", reward: 1 },
        { id: 108, cat: "Síla a zdraví", title: "Sníst porci zeleniny navíc", reward: 1 },
        { id: 109, cat: "Síla a zdraví", title: "Jít po schodech místo výtahu", reward: 1 },
        { id: 110, cat: "Síla a zdraví", title: "15 minut svižné chůze", reward: 2 },
        { id: 111, cat: "Síla a zdraví", title: "Jít spát v 23:00", reward: 2 },
        { id: 112, cat: "Síla a zdraví", title: "10 minut meditace", reward: 2 },
        { id: 113, cat: "Síla a zdraví", title: "30 minut procházky", reward: 3 },
        { id: 114, cat: "Síla a zdraví", title: "Ujít 3 000 kroků", reward: 3 },
        { id: 115, cat: "Síla a zdraví", title: "Jít spát ve 22:30", reward: 5 },
        { id: 116, cat: "Síla a zdraví", title: "Ujít 5 000 kroků", reward: 5 },
        { id: 117, cat: "Síla a zdraví", title: "30 minut cvičení", reward: 10 },
        
        { id: 201, cat: "Vztahy", title: "Napsat milou zprávu", reward: 1 },
        { id: 202, cat: "Vztahy", title: "Upřímně někoho pochválit", reward: 1 },
        { id: 203, cat: "Vztahy", title: "Poděkovat kolegovi", reward: 1 },
        { id: 204, cat: "Vztahy", title: "Zavolat rodičům nebo rodině", reward: 2 },
        { id: 205, cat: "Vztahy", title: "Aktivně vyslechnout", reward: 2 },
        { id: 206, cat: "Vztahy", title: "Položit hlubší otázku", reward: 1 },
        { id: 207, cat: "Vztahy", title: "Pozvat někoho na kávu", reward: 3 },
        { id: 208, cat: "Vztahy", title: "Naplánovat společnou aktivitu", reward: 3 },
        { id: 209, cat: "Vztahy", title: "Přinést drobnou pozornost", reward: 3 },
        { id: 210, cat: "Vztahy", title: "Pomoci někomu s problémem", reward: 4 },
        { id: 211, cat: "Vztahy", title: "Vyjít s I (večeře/kino)", reward: 5 },
        { id: 212, cat: "Vztahy", title: "Mentorovat kolegu/známého", reward: 5 },
        { id: 213, cat: "Vztahy", title: "Rodinná návštěva/akce", reward: 5 },
        { id: 214, cat: "Vztahy", title: "Uspořádat setkání s přáteli", reward: 5 },
        
        { id: 301, cat: "Moudrost a bohatství", title: "Přečíst 10 stran knihy", reward: 1 },
        { id: 302, cat: "Moudrost a bohatství", title: "Poslechnout investiční podcast", reward: 3 },
        { id: 303, cat: "Moudrost a bohatství", title: "Reflexe do deníku", reward: 2 },
        { id: 304, cat: "Moudrost a bohatství", title: "Naplánovat následující den", reward: 2 },
        { id: 305, cat: "Moudrost a bohatství", title: "Dokončit odkládaný úkol", reward: 3 },
        { id: 306, cat: "Moudrost a bohatství", title: "25 min soustředěné práce", reward: 3 },
        { id: 307, cat: "Moudrost a bohatství", title: "Projít investiční watchlist", reward: 3 },
        { id: 308, cat: "Moudrost a bohatství", title: "Poznámky do invest. deníku", reward: 3 },
        { id: 309, cat: "Moudrost a bohatství", title: "Prostudovat jednu společnost", reward: 5 },
        { id: 310, cat: "Moudrost a bohatství", title: "Porovnat dvě inv. příležitosti", reward: 5 },
        { id: 311, cat: "Moudrost a bohatství", title: "Hodina hluboké práce na projektu", reward: 8 },
        { id: 312, cat: "Moudrost a bohatství", title: "Napsat článek nebo delší text", reward: 8 },
        { id: 313, cat: "Moudrost a bohatství", title: "Aktualizace strategie/cílů", reward: 10 }
    ];

    const svgCoin1 = `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="40" fill="#fbbf24" stroke="#d97706" stroke-width="4"/><circle cx="50" cy="50" r="28" fill="none" stroke="#d97706" stroke-width="2"/></svg>`;
    const svgCoinStack = `<svg viewBox="0 0 100 100" width="100%" height="100%"><ellipse cx="50" cy="75" rx="35" ry="15" fill="#d97706" /><ellipse cx="50" cy="70" rx="35" ry="15" fill="#fbbf24" /><ellipse cx="50" cy="55" rx="35" ry="15" fill="#d97706" /><ellipse cx="50" cy="50" rx="35" ry="15" fill="#fbbf24" /><ellipse cx="50" cy="35" rx="35" ry="15" fill="#d97706" /><ellipse cx="50" cy="30" rx="35" ry="15" fill="#fbbf24" /></svg>`;
    const svgCoinPile = `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="30" cy="70" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><circle cx="70" cy="65" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><circle cx="50" cy="45" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><circle cx="45" cy="80" r="15" fill="#fbbf24" stroke="#d97706" stroke-width="2"/></svg>`;

    function getCoinIcon(reward) {
        const absReward = Math.abs(reward);
        if (absReward <= 1) return svgCoin1;
        if (absReward >= 2 && absReward <= 4) return svgCoinStack;
        return svgCoinPile;
    }

    // APLIKAČNÍ STAV
    let state = {
        totalCoins: 0,
        logs: [],
        todayTasks: [],
        rerollUsedToday: false
    };

    const STORAGE_KEY = 'sovi_pokladnicka_v3';

function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        state = JSON.parse(saved);
    }
    
    // Pokud dnešní úkoly chybí (první spuštění nebo prázdný stav), automaticky vygeneruje nový den bez ptaní
    if (!state.todayTasks || state.todayTasks.length === 0) {
        generateNewDay(true);
    } else {
        renderApp();
    }
}

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // FÁZE 5: Zvukový efekt cinknutí
    function playCoinSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, ctx.currentTime); // B5
            osc.frequency.exponentialRampToValueAtTime(1318.51, ctx.currentTime + 0.08); // E6

            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } catch (e) {
            // Audio není podporováno nebo je blokováno prohlížečem
        }
    }

    // GENERÁTOR DNŮ
    function generateNewDay(isInitial = false) {
        if (!isInitial && state.todayTasks.length > 0) {
            if (!confirm("Opravdu chceš zahájit nový den? Všechny dnešní NESPLNĚNÉ úkoly zmizí a vygenerují se nové.")) {
                return;
            }
        }

        state.todayTasks = [];
        state.rerollUsedToday = false; // Reset denního rerollu
        
        const categories = ["Síla a zdraví", "Vztahy", "Moudrost a bohatství"];
        
        categories.forEach(catName => {
            const filtered = taskPool.filter(t => t.cat === catName);
            const shuffled = filtered.sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 5);
            
            selected.forEach(t => {
                state.todayTasks.push({ id: t.id, completed: false, isUrgent: false });
            });
        });

        if (state.todayTasks.length > 0) {
            const randomIndex = Math.floor(Math.random() * state.todayTasks.length);
            state.todayTasks[randomIndex].isUrgent = true;
        }

        saveState();
        renderApp();
    }

    // FÁZE 4: REROLL URGENTNÍHO ÚKOLU
    function rerollUrgent() {
        const uncompletedTasks = state.todayTasks.filter(t => !t.completed);
        
        if (state.rerollUsedToday) {
            alert("Reroll už byl dnes použit!");
            return;
        }
        if (state.totalCoins < 1) {
            alert("Na reroll potřebuješ alespoň 1 zlaťák!");
            return;
        }
        if (uncompletedTasks.length < 2) {
            alert("Pro reroll potřebuješ alespoň 2 otevřené úkoly.");
            return;
        }

        // Strhnout zlaťák
        state.totalCoins -= 1;
        state.rerollUsedToday = true;

        // Odebrat urgenci ze starého
        const currentUrgent = state.todayTasks.find(t => t.isUrgent && !t.completed);
        if (currentUrgent) {
            currentUrgent.isUrgent = false;
        }

        // Vybrat nový náhodný
        const eligibleNewTasks = state.todayTasks.filter(t => !t.completed && t !== currentUrgent);
        const randomPick = eligibleNewTasks[Math.floor(Math.random() * eligibleNewTasks.length)];
        randomPick.isUrgent = true;

        // Log Rerollu
        state.logs.unshift({
            id: Date.now(),
            timestamp: new Date().toISOString(),
            catName: "Systém",
            title: "🎲 Reroll urgence",
            reward: -1
        });

        saveState();
        renderApp();
        pulseCounter();
    }

    // SPLNĚNÍ BĚŽNÉHO ÚKOLU
    function completeTask(taskId) {
        const taskState = state.todayTasks.find(t => t.id === taskId);
        if (!taskState || taskState.completed) return;

        const fullData = taskPool.find(t => t.id === taskId);
        const finalReward = taskState.isUrgent ? (fullData.reward * 2) : fullData.reward;

        taskState.completed = true;
        state.totalCoins += finalReward;

        const now = new Date();
        state.logs.unshift({
            id: now.getTime(),
            timestamp: now.toISOString(),
            catName: fullData.cat,
            title: taskState.isUrgent ? `🔥 ${fullData.title}` : fullData.title,
            reward: finalReward
        });

        saveState();
        renderApp();
        pulseCounter();
        playCoinSound();
    }

    // FÁZE 6: VYKONÁNÍ VOLNÉHO ÚKOLU / TRANSAKCE
    function executeCustomTask() {
        const titleInput = document.getElementById("custom-title");
        const rewardInput = document.getElementById("custom-reward");

        const title = titleInput.value.trim();
        const reward = parseInt(rewardInput.value, 10);

        if (!title) {
            alert("Zadej prosím popis akce.");
            return;
        }
        if (isNaN(reward) || reward === 0) {
            alert("Zadej platný počet zlaťáků (např. 10 nebo -50).");
            return;
        }

        state.totalCoins += reward;

        const now = new Date();
        state.logs.unshift({
            id: now.getTime(),
            timestamp: now.toISOString(),
            catName: "Volná akce",
            title: title,
            reward: reward
        });

        titleInput.value = "";
        rewardInput.value = "";

        saveState();
        renderApp();
        pulseCounter();
        if (reward > 0) playCoinSound();
    }

    // VYKRESLENÍ APLIKACE
    const appContainer = document.getElementById("app-content");
    const counterSpan = document.getElementById("total-coins");
    const logList = document.getElementById("activity-log");
    const rerollBtn = document.getElementById("reroll-btn");

    function renderApp() {
        counterSpan.innerText = state.totalCoins;

        // Stav Reroll tlačítka
        const openTasksCount = state.todayTasks.filter(t => !t.completed).length;
        const canReroll = !state.rerollUsedToday && state.totalCoins >= 1 && openTasksCount >= 2;
        rerollBtn.disabled = !canReroll;
        rerollBtn.innerText = state.rerollUsedToday 
            ? "🎲 Přelosováno (zítra znovu)" 
            : "🎲 Přelosovat urgenci (1 🪙)";

        // Logy
        logList.innerHTML = "";
        state.logs.slice(0, 50).forEach(entry => {
            const date = new Date(entry.timestamp);
            const formattedTime = date.toLocaleDateString('cs-CZ') + ' ' + date.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'});
            
            const sign = entry.reward >= 0 ? "+" : "";
            const li = document.createElement("li");
            li.className = "log-item";
            li.innerHTML = `
                <span>${formattedTime} - ${entry.title} (${entry.catName})</span>
                <strong>${sign}${entry.reward} Z</strong>
            `;
            logList.appendChild(li);
        });

        // Sloupce s úkoly
        appContainer.innerHTML = "";
        const categoriesNames = ["Síla a zdraví", "Vztahy", "Moudrost a bohatství"];

        categoriesNames.forEach(catName => {
            const col = document.createElement("div");
            col.className = "category-column";
            
            const header = document.createElement("div");
            header.className = "category-header";
            header.innerText = catName;
            col.appendChild(header);

            const tasksForTodayInCat = state.todayTasks
                .map(tState => {
                    const fullData = taskPool.find(tData => tData.id === tState.id);
                    if (fullData && fullData.cat === catName) {
                        return { ...fullData, completed: tState.completed, isUrgent: tState.isUrgent };
                    }
                    return null;
                })
                .filter(t => t !== null);
            
            tasksForTodayInCat.forEach(task => {
                const taskDiv = document.createElement("div");
                
                let classNames = "task-card";
                if (task.completed) classNames += " completed";
                if (task.isUrgent) classNames += " urgent";
                taskDiv.className = classNames;
                
                if (!task.completed) {
                    taskDiv.onclick = () => completeTask(task.id);
                }

                const displayReward = task.isUrgent ? (task.reward * 2) : task.reward;
                const urgentBadgeHTML = task.isUrgent ? `<span class="urgent-badge">🔥 URGENTNÍ (2x)</span>` : '';

                taskDiv.innerHTML = `
                    <div class="task-info">
                        ${urgentBadgeHTML}
                        <div class="task-title">${task.title}</div>
                    </div>
                    <div class="task-reward">
                        <span>+${displayReward}</span>
                        <div class="reward-icon">${getCoinIcon(displayReward)}</div>
                    </div>
                `;
                col.appendChild(taskDiv);
            });

            appContainer.appendChild(col);
        });
    }

    function pulseCounter() {
        const cnt = document.getElementById('main-counter');
        cnt.classList.add('pulse');
        setTimeout(() => cnt.classList.remove('pulse'), 150);
    }

    function clearData() {
        if(confirm("Opravdu smazat celou pokladničku a logy?")) {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
    }

    loadState();
</script>

</body>
</html>
